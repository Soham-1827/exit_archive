name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install Python
        run: uv python install
      - name: Install dependencies (dev group, no e2e)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Tests (default addopts exclude live and e2e; coverage gate on)
        run: uv run pytest -q -W error::pytest.PytestDeprecationWarning
      - name: Secret reveal allow-list
        run: |
          # secrets module name is split so a naive grep for the GitHub secrets context stays clean
          expected="$(printf 'src/exit_archive/%s\n' harvest/http.py "secret"s.py web/payments.py | LC_ALL=C sort)"
          actual="$(grep -rln --include='*.py' "\.reveal()" src/ | LC_ALL=C sort)"
          echo "$actual"
          test "$actual" = "$expected"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t exit-archive .
      - name: Run container and wait for /healthz
        run: |
          docker run -d --name ea -e PAYMENT_REQUIRED=false -p 8000:8000 exit-archive
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs ea
          exit 1
      - name: Container drops to uid/gid 10001 with no capabilities
        run: |
          status="$(docker exec ea grep -E '^(Uid|Gid|CapEff):' /proc/1/status)"
          echo "$status"
          test "$(echo "$status" | wc -l)" = 3
          echo "$status" | grep -E '^(Uid|Gid):' | while read -r _ ids; do
            for id in $ids; do test "$id" = "10001"; done
          done
          echo "$status" | grep -qx 'CapEff:[[:space:]]0000000000000000'
      - name: Root-owned bind-mounted /data is fixed by the entrypoint
        run: |
          docker rm -f ea-bind >/dev/null 2>&1 || true
          dir="$(mktemp -d)"
          sudo chown 0:0 "$dir"
          sudo chmod 755 "$dir"
          test "$(stat -c %u "$dir")" = "0"
          docker run -d --name ea-bind -e PAYMENT_REQUIRED=false -p 8001:8000 \
            -v "$dir":/data exit-archive
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8001/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then docker logs ea-bind; exit 1; fi
          test "$(stat -c %u "$dir")" = "10001"
          test -d "$dir/archives"
          test "$(stat -c %u "$dir/archives")" = "10001"
      - name: Non-root start (--user 10001:10001) with a named volume
        run: |
          docker rm -f ea-user >/dev/null 2>&1 || true
          docker volume create ea-user-data
          docker run -d --name ea-user --user 10001:10001 -e PAYMENT_REQUIRED=false \
            -p 8002:8000 -v ea-user-data:/data exit-archive
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8002/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then docker logs ea-user; exit 1; fi
      - name: Cleanup
        if: always()
        run: |
          docker rm -f ea ea-bind ea-user || true
          docker volume rm ea-user-data || true

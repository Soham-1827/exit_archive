        { k: "invoice_ref", h: "Invoice" }

        { k: "issue_date", h: "Issued", t: "date" }, { k: "amount", h: "Amount", t: "money" },
        { k: "state", h: "State", t: "state" }, { k: "pdf", h: "PDF", t: "file", label: "PDF" }
      ],
      total: { k: "amount", h: "estimated" }
    },
    expenses: {
      label: "Expenses", client: "client_id", project: "project_id", date: "date",
      sort: { key: "date", dir: -1 },
      cols: [
        { k: "date", h: "Date", t: "date" }, { k: "client_name", h: "Client" },
        { k: "project_name", h: "Project" }, { k: "category_name", h: "Category" },
        { k: "amount", h: "Amount", t: "money" }, { k: "notes", h: "Notes", t: "notes" },
        { k: "receipt", h: "Receipt", t: "file", label: "Receipt" }
      ],
      total: { k: "amount", h: "spent" }
    },
    clients: {
      label: "Clients", client: "id",
      sort: { key: "name", dir: 1 },
      cols: [
        { k: "name", h: "Name", t: "name" }, { k: "currency", h: "Currency" },
        { k: "is_active", h: "Active", t: "bool" }
      ]
    },
    projects: {
      label: "Projects", client: "client_id", project: "id",
      sort: { key: "name", dir: 1 },
      cols: [
        { k: "name", h: "Name", t: "name" }, { k: "code", h: "Code" },
        { k: "client_name", h: "Client" }, { k: "is_active", h: "Active", t: "bool" }
      ]
    }
  };
  var ORDER = ["time_entries", "invoices", "estimates", "expenses", "clients", "projects"];

  var data = window.EXIT_ARCHIVE_DATA;
  var $ = function (id) { return document.getElementById(id); };
  if (!data || typeof data !== "object") {
    $("empty-state").hidden = false;
    return;
  }
  $("app").hidden = false;

  var state = {
    tab: "time_entries", page: 0, query: "", client: "", project: "", from: "", to: "", invoice: "",
    sort: { key: "date", dir: -1 }
  };
  var prepared = {};
  var invoiceNumbers = {};
  var numberFmt = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var intFmt = new Intl.NumberFormat();

  function list(name) { return Array.isArray(data[name]) ? data[name] : []; }
  function present(v) { return v !== null && v !== undefined && v !== ""; }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }

  list("invoices").forEach(function (inv) {
    if (present(inv.id) && present(inv.number)) { invoiceNumbers[String(inv.id)] = String(inv.number); }
  });

  function prepare(tab) {
    if (prepared[tab]) { return prepared[tab]; }
    var spec = TABS[tab];
    prepared[tab] = list(tab).map(function (r) {
      var item = r && typeof r === "object" ? r : {};
      var ref = null;
      if (tab === "time_entries" && present(item.invoice_id)) {
        ref = invoiceNumbers[String(item.invoice_id)] || "#" + item.invoice_id;
      }
      var view = Object.assign({}, item, { invoice_ref: ref });
      var hay = spec.cols.map(function (c) { return present(view[c.k]) ? String(view[c.k]) : ""; });
      return { r: view, hay: hay.join("\n").toLowerCase(), inv: ref ? ref.toLowerCase() : "" };
    });
    return prepared[tab];
  }

  function fmtDate(iso) {
    var d = new Date(iso);
    return isNaN(d.getTime()) ? String(iso) : d.toLocaleString(undefined, { dateStyle: "long", timeStyle: "short" });
  }

  function applies(spec, filter) {
    if (filter === "client") { return Boolean(spec.client); }
    if (filter === "project") { return Boolean(spec.project); }
    if (filter === "date") { return Boolean(spec.date); }
    return Boolean(spec.invoice);
  }

  function matches(item, spec) {
    var r = item.r;
    if (state.query && item.hay.indexOf(state.query) < 0) { return false; }
    if (state.client && applies(spec, "client") && String(r[spec.client]) !== state.client) { return false; }
    if (state.project && applies(spec, "project") && String(r[spec.project]) !== state.project) { return false; }
    if (applies(spec, "date")) {
      var d = present(r[spec.date]) ? String(r[spec.date]) : "";
      if ((state.from || state.to) && !d) { return false; }
      if (state.from && d < state.from) { return false; }
      if (state.to && d > state.to) { return false; }
    }
    if (state.invoice && applies(spec, "invoice")) {
      var number = spec === TABS.invoices ? String(r.number || "").toLowerCase() : item.inv;
      if (number.indexOf(state.invoice.toLowerCase()) < 0) { return false; }
    }
    return true;
  }

  function compare(key, dir, kind) {
    return function (a, b) {
      var x = a.r[key], y = b.r[key];
      if (!present(x) && !present(y)) { return 0; }
      if (!present(x)) { return 1; }
      if (!present(y)) { return -1; }
      if (kind === "num") { return (num(x) - num(y)) * dir; }
      return String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: "base" }) * dir;
    };
  }

  function kindOf(spec, key) {
    var col = spec.cols.filter(function (c) { return c.k === key; })[0];
    return col && (col.t === "hours" || col.t === "money") ? "num" : "text";
  }

  function options(select, entries, allLabel, keep) {
    clear(select);
    var all = el("option", "", allLabel);
    all.value = "";
    select.appendChild(all);
    entries.forEach(function (e) {
      var o = el("option", "", e[1]);
      o.value = e[0];
      select.appendChild(o);
    });
    select.value = entries.some(function (e) { return e[0] === keep; }) ? keep : "";

  function collectNames(tab, idKey, nameKey, into) {
    list(tab).forEach(function (r) {
      if (r && present(r[idKey]) && !(String(r[idKey]) in into)) {

  function sortedEntries(map) {
    return Object.keys(map).map(function (k) { return [k, map[k]]; }).sort(function (a, b) {

  var clientNames = {};
  collectNames("clients", "id", "name", clientNames);

    collectNames(t, "client_id", "client_name", clientNames);
  });
  var projectsByClient = {};
  var projectNames = {};
  collectNames("projects", "id", "name", projectNames);
  ["time_entries", "expenses"].forEach(function (t) { collectNames(t, "project_id", "project_name", projectNames); });
  list("projects").forEach(function (p) {
    if (p && present(p.id)) { projectsByClient[String(p.id)] = present(p.client_id) ? String(p.client_id) : ""; }
  });

  function refreshFilterControls(spec) {
    state.client = options($("filter-client"), sortedEntries(clientNames), "All clients", state.client);
    var projects = {};
    Object.keys(projectNames).forEach(function (id) {
      if (!state.client || projectsByClient[id] === state.client || !(id in projectsByClient)) { projects[id] = projectNames[id]; }
    });
    state.project = options($("filter-project"), sortedEntries(projects), "All projects", state.project);
    $("filter-client").disabled = !applies(spec, "client");
    $("filter-project").disabled = !applies(spec, "project");
    $("filter-from").disabled = !applies(spec, "date");
    $("filter-to").disabled = !applies(spec, "date");
    $("filter-invoice").disabled = !applies(spec, "invoice");
  }

  function link(cell, value, label) {
    if (typeof value === "string" && SAFE_PATH.test(value) && value.indexOf("/.") < 0 && value.indexOf("..") < 0) {
      var a = document.createElement("a");
      a.setAttribute("href", value);
      a.setAttribute("rel", "noopener");
      a.textContent = label;
      cell.appendChild(a);
    } else if (present(value)) {
      cell.textContent = String(value);
    } else {
      cell.appendChild(el("span", "dash", "—"));
    }
  }

  function fill(cell, col, value) {
    if (col.t === "file") { link(cell, value, col.label); return; }
    if (!present(value) && value !== false) { cell.appendChild(el("span", "dash", "—")); return; }
    if (col.t === "hours" || col.t === "money") { cell.textContent = numberFmt.format(num(value)); }
    else if (col.t === "bool") { cell.textContent = value ? "Yes" : "No"; }
    else if (col.t === "state") {
      var tone = STATE_TONE[String(value).toLowerCase()];
      cell.appendChild(el("span", "chip" + (tone ? " " + tone : ""), String(value)));
    } else { cell.textContent = String(value); }
  }

  function renderHead(spec) {
    var head = $("head");
    clear(head);
    var tr = document.createElement("tr");
    spec.cols.forEach(function (col) {
      var th = document.createElement("th");
      th.setAttribute("scope", "col");
      var numeric = col.t === "hours" || col.t === "money";
      if (numeric) { th.className = "num"; }
      var sorted = state.sort.key === col.k;
      th.setAttribute("aria-sort", sorted ? (state.sort.dir > 0 ? "ascending" : "descending") : "none");
      var button = el("button", "sort", col.h);
      button.type = "button";
      button.addEventListener("click", function () {
        state.sort = { key: col.k, dir: state.sort.key === col.k ? -state.sort.dir : 1 };
        state.page = 0;
        render();
      });
      th.appendChild(button);
      tr.appendChild(th);
    });
    head.appendChild(tr);
  }

  function renderSummary(spec, shown, total, matchesList) {
    var box = $("summary");
    clear(box);
    function stat(value, text) {
      var s = el("span", "stat");
      s.appendChild(el("b", "", value));
      s.appendChild(document.createTextNode(text));
      box.appendChild(s);
    }
    var filtered = shown !== total;
    stat(intFmt.format(shown), filtered ? " of " + intFmt.format(total) + " records" : " records");
    if (spec.total) {
      var sum = 0, extra = 0;
      matchesList.forEach(function (i) {
        sum += num(i.r[spec.total.k]);
        if (spec.total.extra && i.r[spec.total.extra.when]) { extra += num(i.r[spec.total.extra.k]); }
      });
      stat(numberFmt.format(sum), " " + spec.total.h);
      if (spec.total.extra) { stat(numberFmt.format(extra), " " + spec.total.extra.h); }
    }
  }

  function render() {
    var spec = TABS[state.tab];
    refreshFilterControls(spec);
    var all = prepare(state.tab);
    var found = all.filter(function (item) { return matches(item, spec); });
    found.sort(compare(state.sort.key, state.sort.dir, kindOf(spec, state.sort.key)));
    var pages = Math.max(1, Math.ceil(found.length / PAGE_SIZE));
    state.page = Math.min(state.page, pages - 1);
    var start = state.page * PAGE_SIZE;
    var slice = found.slice(start, start + PAGE_SIZE);

    renderHead(spec);
    var body = $("rows");
    clear(body);
    var fragment = document.createDocumentFragment();
    slice.forEach(function (item) {
      var tr = document.createElement("tr");
      spec.cols.forEach(function (col) {
        var td = document.createElement("td");
        td.setAttribute("data-label", col.h);
        var cls = col.t === "hours" || col.t === "money" ? "num" : (col.t || "");
        if (cls) { td.className = cls; }
        fill(td, col, item.r[col.k]);
        tr.appendChild(td);
      });
      fragment.appendChild(tr);
    });
    body.appendChild(fragment);
    $("no-results").hidden = slice.length > 0;
    $("caption").textContent = spec.label + ": " + found.length + " matching records";
    renderSummary(spec, found.length, all.length, found);

    $("page-info").textContent = found.length
      ? intFmt.format(start + 1) + "–" + intFmt.format(start + slice.length) + " of " + intFmt.format(found.length)
        + (pages > 1 ? " · page " + (state.page + 1) + " of " + pages : "")
      : "0 results";
    $("prev").disabled = state.page === 0;
    $("next").disabled = state.page >= pages - 1;

    Array.prototype.forEach.call(document.querySelectorAll("#tabs .tab"), function (tab) {
      var on = tab.getAttribute("data-tab") === state.tab;
      tab.setAttribute("aria-selected", on ? "true" : "false");
      tab.tabIndex = on ? 0 : -1;
    });
  }

  function selectTab(name) {
    if (!TABS[name]) { return; }
    state.tab = name;
    state.page = 0;
    state.sort = { key: TABS[name].sort.key, dir: TABS[name].sort.dir };
    render();
  }

  var tabButtons = Array.prototype.slice.call(document.querySelectorAll("#tabs .tab"));
  tabButtons.forEach(function (button, index) {
    var name = button.getAttribute("data-tab");
    button.querySelector(".count").textContent = intFmt.format(list(name).length);
    button.addEventListener("click", function () { selectTab(name); });
    button.addEventListener("keydown", function (event) {
      var next = { ArrowRight: index + 1, ArrowLeft: index - 1, Home: 0, End: tabButtons.length - 1 }[event.key];
      if (next === undefined) { return; }
      event.preventDefault();
      var target = tabButtons[(next + tabButtons.length) % tabButtons.length];
      selectTab(target.getAttribute("data-tab"));
      target.focus();
    });
  });

  var timer = null;
  $("search").addEventListener("input", function (event) {
    window.clearTimeout(timer);
    var value = event.target.value.trim().toLowerCase();
    timer = window.setTimeout(function () { state.query = value; state.page = 0; render(); }, 120);
  });
  [["filter-client", "client"], ["filter-project", "project"], ["filter-from", "from"],
   ["filter-to", "to"], ["filter-invoice", "invoice"]].forEach(function (pair) {
    var node = $(pair[0]);
    node.addEventListener(node.tagName === "SELECT" ? "change" : "input", function () {
      state[pair[1]] = node.value.trim();
      state.page = 0;
      render();
    });
  });
  $("reset").addEventListener("click", function () {
    window.clearTimeout(timer);
    state.query = state.client = state.project = state.from = state.to = state.invoice = "";
    ["search", "filter-from", "filter-to", "filter-invoice"].forEach(function (id) { $(id).value = ""; });
    state.page = 0;
    render();
  });
  $("prev").addEventListener("click", function () { state.page = Math.max(0, state.page - 1); render(); });
  $("next").addEventListener("click", function () { state.page += 1; render(); });

  var name = present(data.company_name) ? String(data.company_name) : "Harvest archive";
  $("company").textContent = name;
  document.title = name + " – Exit Archive";
  $("generated").textContent = present(data.generated_at) ? "Archive generated " + fmtDate(data.generated_at) : "";
  render();
})();
</script>
</body>
</html>
